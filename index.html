<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>MR Detailing Academy</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Hebrew font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
      <button id="closeBtn" class="icon-btn" aria-label="close">✕</button>

      <div class="brand" id="brandTap" role="button" aria-label="brand">
        <div class="brand__logo">MR</div>
        <div>
          <div class="brand__title">Detailing Academy</div>
          <div class="brand__subtitle" id="brandSubtitle">Внутренний мир детейлинга</div>
        </div>
      </div>

      <button id="langToggle" class="chip" type="button">RU</button>
    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- HOME -->
      <section class="screen is-active" id="screen-home">
        <div class="hero">
          <div class="panel">
            <div class="kicker">
              <span id="greeting">Привет,</span>
              <span id="username">мастер</span>
            </div>
            <h1 class="title">MR Detailing Academy</h1>
            <p class="lead" id="homeLead"></p>

            <div class="hero__actions">
              <button class="btn btn-primary" id="openCourses" type="button"></button>
              <button class="btn btn-secondary" id="openWiki" type="button"></button>
            </div>

            <div class="stats" id="homeStats"></div>
          </div>

          <div class="glass-card">
            <div class="glass-card__title" id="quickTitle"></div>
            <div class="glass-card__list" id="quickList"></div>
            <button class="btn" id="openWash" type="button"></button>
            <div class="hint" id="quickHint"></div>
          </div>
        </div>

        <section class="section">
          <div class="section__head">
            <h2 class="section__title" id="homeSectionTitle"></h2>
          </div>
          <div id="homeRecommended" class="grid"></div>
        </section>
      </section>

      <!-- NEWS -->
      <section class="screen" id="screen-news">
        <div class="section__head">
          <h2 class="section__title" id="newsTitle">Новости</h2>
          <div class="row">
            <button class="btn btn-ghost" id="newsRefreshBtn" type="button">Обновить</button>
            <button class="btn btn-ghost" id="newsClearBtn" type="button">Сбросить кэш</button>
          </div>
        </div>

        <div class="panel">
          <div class="kicker" id="newsSubtitle">Новинки и обновления из мира детейлинга (RSS).</div>

          <div class="hr"></div>

          <div class="row">
            <label class="kicker" style="min-width:110px;" id="newsSourcesLabel">Источники</label>
            <select class="select" id="newsSourceSelect">
              <option value="all">Все</option>
              <option value="autogeek">Autogeek</option>
              <option value="detailedimage">Detailed Image</option>
            </select>
          </div>

          <div class="row" style="margin-top:10px;">
            <input class="input" id="newsSearch" placeholder="Поиск" />
          </div>

          <div class="hint" id="newsHint" style="margin-top:10px;"></div>
        </div>

        <section class="section">
          <div id="newsRoot" class="grid"></div>
        </section>
      </section>

      <!-- COURSES -->
      <section class="screen" id="screen-courses">
        <div class="section__head">
          <h2 class="section__title" id="coursesTitle"></h2>
        </div>

        <div class="row">
          <input class="input" id="coursesSearch" placeholder="" />
          <select class="select" id="coursesFilter">
            <option value="all">Все</option>
            <option value="free">Бесплатные</option>
            <option value="paid">Платные</option>
            <option value="owned">Доступные мне</option>
          </select>
        </div>

        <section class="section">
          <div id="coursesRoot" class="grid"></div>
        </section>
      </section>

      <!-- COURSE -->
      <section class="screen" id="screen-course">
        <div class="subbar">
          <button class="btn btn-ghost" id="backToCourses" type="button">← Назад</button>
          <div class="subbar__title" id="courseTitle">Курс</div>
        </div>

        <div class="course">
          <div id="courseRoot" class="panel"></div>
          <div id="lessonsList" class="list"></div>
        </div>
      </section>

      <!-- LESSON -->
      <section class="screen" id="screen-lesson">
        <div class="subbar">
          <button class="btn btn-ghost" id="backToCourse" type="button">← Назад</button>
          <div class="subbar__title" id="lessonTitle">Урок</div>
        </div>
        <div id="lessonRoot" class="lesson"></div>
      </section>

      <!-- TEST -->
      <section class="screen" id="screen-test">
        <div class="subbar">
          <button class="btn btn-ghost" id="backToLesson" type="button">← Назад</button>
          <div class="subbar__title" id="testTitle">Тест</div>
        </div>
        <div id="testRoot" class="test"></div>
      </section>

      <!-- PROGRESS -->
      <section class="screen" id="screen-progress">
        <div class="section__head">
          <h2 class="section__title" id="progressTitle"></h2>
        </div>
        <div id="progressRoot" class="grid"></div>
      </section>

      <!-- WIKI -->
      <section class="screen" id="screen-wiki">
        <div class="section__head">
          <h2 class="section__title" id="wikiTitle"></h2>
        </div>

        <div class="row">
          <input class="input" id="wikiSearch" placeholder="" />
          <select class="select" id="wikiCategory">
            <option value="all">Все категории</option>
          </select>
        </div>

        <section class="section">
          <div id="wikiRoot" class="grid"></div>
        </section>
      </section>

      <!-- PROFILE -->
      <section class="screen" id="screen-profile">
        <div class="section__head">
          <h2 class="section__title" id="profileTitle"></h2>
        </div>

        <div class="panel">
          <div class="profile">
            <div class="profile__avatar" id="profileAvatar">MR</div>
            <div>
              <div class="profile__name" id="profileName">Пользователь</div>
              <div class="profile__meta" id="profileMeta">Telegram WebApp</div>
            </div>
          </div>

          <div class="hr"></div>

          <div class="row">
            <button class="btn btn-ghost" id="resetProgress" type="button">Сбросить прогресс</button>
            <button class="btn btn-ghost" id="exportData" type="button">Экспорт данных</button>
          </div>

          <div class="hint" id="profileHint">Админ-панель: 7 раз нажми на логотип “MR” сверху.</div>

          <div class="hr"></div>

          <div class="h3" id="ownedTitle">Мои доступы</div>
          <div id="ownedRoot" class="list"></div>

          <div class="hr"></div>

          <button class="btn btn-secondary" id="openAdminFromProfile" type="button">Админ</button>
        </div>
      </section>

      <!-- ADMIN -->
      <section class="screen" id="screen-admin">
        <div class="subbar">
          <button class="btn btn-ghost" id="backFromAdmin" type="button">← Назад</button>
          <div class="subbar__title" id="adminTitle">Админ</div>
        </div>
        <div id="adminRoot" class="panel"></div>
      </section>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="nav">
      <button class="nav__item is-active" data-tab="home" type="button"><span id="navHome">Главная</span></button>
      <button class="nav__item" data-tab="news" type="button"><span id="navNews">Новости</span></button>
      <button class="nav__item" data-tab="courses" type="button"><span id="navCourses">Курсы</span></button>
      <button class="nav__item" data-tab="progress" type="button"><span id="navProgress">Прогресс</span></button>
      <button class="nav__item" data-tab="wiki" type="button"><span id="navWiki">Вики</span></button>
      <button class="nav__item" data-tab="profile" type="button"><span id="navProfile">Профиль</span></button>
    </nav>

  </div>

  <script src="./app.js"></script>
</body>
</html>
