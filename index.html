<!doctype html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>MR Detailing Academy</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Hebrew font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
      <button id="closeBtn" class="icon-btn" aria-label="close">✕</button>

      <div class="brand" id="brandTap" role="button" aria-label="brand">
        <div class="brand__logo">MR</div>
        <div>
          <div class="brand__title">Detailing Academy</div>
          <div class="brand__subtitle" id="brandSubtitle">Внутренний мир детейлинга</div>
        </div>
      </div>

      <button id="langToggle" class="chip" type="button">RU</button>
      <button id="profileBtn" class="icon-btn" aria-label="profile">👤</button>
    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- HOME -->
      <section class="screen is-active" id="screen-home">
        <div class="hero">
          <div class="panel">
            <div class="kicker">
              <span id="greeting">Привет,</span>
              <span id="username">мастер</span>
            </div>
            <h1 class="title">MR Detailing Academy</h1>
            <p class="lead" id="homeLead"></p>

            <div class="hero__actions">
              <button class="btn btn-primary" id="homeOpenCourses" type="button"></button>
              <button class="btn btn-secondary" id="homeOpenWiki" type="button"></button>
            </div>

            <div class="stats" id="homeStats"></div>
          </div>

          <div class="glass-card">
            <div class="glass-card__title" id="newsBlockTitle"></div>
            <div class="kicker" id="newsBlockSubtitle"></div>

            <div class="hr"></div>

            <div class="row">
              <input class="input" id="newsSearch" placeholder="Поиск" />
              <button class="btn btn-ghost" id="newsRefreshBtn" type="button">Обновить</button>
            </div>

            <div class="hint" id="newsHint" style="margin-top:10px;"></div>

            <div class="hr"></div>

            <div id="newsRoot" class="stack"></div>
          </div>
        </div>

        <section class="section">
          <div class="section__head">
            <h2 class="section__title" id="homeSectionTitle"></h2>
          </div>
          <div id="homeRecommended" class="grid"></div>
        </section>
      </section>

      <!-- COURSES -->
      <section class="screen" id="screen-courses">
        <div class="section__head">
          <h2 class="section__title" id="coursesTitle"></h2>
        </div>

        <div class="row">
          <input class="input" id="coursesSearch" placeholder="" />
          <select class="select" id="coursesFilter">
            <option value="all">Все</option>
            <option value="free">Бесплатные</option>
            <option value="paid">Платные</option>
            <option value="owned">Доступные мне</option>
          </select>
        </div>

        <section class="section">
          <div id="coursesRoot" class="grid"></div>
        </section>
      </section>

      <!-- COURSE -->
      <section class="screen" id="screen-course">
        <div class="subbar">
          <button class="btn btn-ghost" id="backToCourses" type="button">← Назад</button>
          <div class="subbar__title" id="courseTitle">Курс</div>
        </div>

        <div class="course">
          <div id="courseRoot" class="panel"></div>
          <div id="lessonsList" class="list"></div>
        </div>
      </section>

      <!-- LESSON -->
      <section class="screen" id="screen-lesson">
        <div class="subbar">
          <button class="btn btn-ghost" id="backToCourse" type="button">← Назад</button>
          <div class="subbar__title" id="lessonTitle">Урок</div>
        </div>
        <div id="lessonRoot" class="lesson"></div>
      </section>

      <!-- SUPPORT -->
      <section class="screen" id="screen-support">
        <div class="section__head">
          <h2 class="section__title" id="supportTitle"></h2>
        </div>

        <div class="panel">
          <div class="kicker" id="supportSubtitle"></div>
          <div class="hr"></div>

          <div class="grid" id="supportCards"></div>

          <div class="hr"></div>

          <div class="h3" id="supportFormTitle"></div>
          <div class="row">
            <input class="input" id="supportTopic" placeholder="Тема" />
          </div>
          <div class="row" style="margin-top:10px;">
            <textarea class="textarea" id="supportMessage" placeholder="Опиши ситуацию: авто, год, что делал, какую химию/пасту использовал, что получилось."></textarea>
          </div>
          <div class="row" style="margin-top:10px;">
            <button class="btn btn-primary" id="supportSendBtn" type="button">Отправить</button>
            <button class="btn btn-ghost" id="supportCopyBtn" type="button">Скопировать</button>
          </div>

          <div class="hint" id="supportHint" style="margin-top:10px;"></div>
        </div>
      </section>

      <!-- WIKI -->
      <section class="screen" id="screen-wiki">
        <div class="section__head">
          <h2 class="section__title" id="wikiTitle"></h2>
        </div>

        <div class="row">
          <input class="input" id="wikiSearch" placeholder="" />
          <select class="select" id="wikiCategory">
            <option value="all">Все категории</option>
          </select>
        </div>

        <section class="section">
          <div id="wikiRoot" class="grid"></div>
        </section>
      </section>

      <!-- PROFILE (not in bottom nav) -->
      <section class="screen" id="screen-profile">
        <div class="subbar">
          <button class="btn btn-ghost" id="backFromProfile" type="button">← Назад</button>
          <div class="subbar__title" id="profileTitle">Профиль</div>
        </div>

        <div class="panel">
          <div class="profile">
            <div class="profile__avatar" id="profileAvatar">MR</div>
            <div>
              <div class="profile__name" id="profileName">Пользователь</div>
              <div class="profile__meta" id="profileMeta">Telegram WebApp</div>
            </div>
          </div>

          <div class="hr"></div>

          <div class="h3" id="accessTitle">Доступы</div>
          <div id="ownedRoot" class="list"></div>

          <div class="hr"></div>

          <div class="row">
            <button class="btn btn-ghost" id="exportData" type="button">Экспорт</button>
            <button class="btn btn-ghost" id="resetLocal" type="button">Сбросить локальные данные</button>
          </div>

          <div class="hint" id="profileHint"></div>

          <div class="hr"></div>

          <div id="adminRoot"></div>
        </div>
      </section>

    </main>

    <!-- BOTTOM NAV (4 tabs) -->
    <nav class="nav">
      <button class="nav__item is-active" data-tab="home" type="button"><span id="navHome">Главная</span></button>
      <button class="nav__item" data-tab="courses" type="button"><span id="navCourses">Курсы</span></button>
      <button class="nav__item" data-tab="support" type="button"><span id="navSupport">Сопровождение</span></button>
      <button class="nav__item" data-tab="wiki" type="button"><span id="navWiki">Вики</span></button>
    </nav>

  </div>

  <script src="./app.js"></script>
</body>
</html>
